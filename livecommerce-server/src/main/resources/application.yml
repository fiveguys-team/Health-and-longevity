# application.yml (서버 배포용)
spring:
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK}
      chat:
        options:
          model: deepseek-chat
          temperature: 1.3
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            scope: openid, email, profile
            redirect-uri: https://healthy-and-longevity.shop/login/oauth2/code/google
            authorization-grant-type: authorization_code
          kakao:
            client-id: ${KAKAO_ID}
            client-secret: ${KAKAO_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: https://healthy-and-longevity.shop/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
jwt:
  secret: ${JWT_SECRET} # JWT 비밀 키
  expiration: 5 # 분 단위
  refresh-expiration: 10080 # 분 단위

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.livecommerce_server   # resultType, parameterType 등에서 패키지명을 생략하고 클래스 이름만 사용 가능하게 해주는 설정
  # 이 패키지 아래에 있는 DTO/VO 클래스들이 자동으로 별칭 등록됨
  configuration:                         # DB 컬럼명이 user_id처럼 snake_case인 경우,
    map-underscore-to-camel-case: true  # 자바 필드명이 userId처럼 camelCase여도 자동으로 매핑해주는 설정
openvidu:
  url: ${OPENVIDU_URL}
  secret: ${OPENVIDU_SECRET}
  webhook:
    url: ${WEBHOOK_URL:https://healthy-and-longevity.shop/api/webhook/openvidu}
ncp:
  object-storage:
    endpoint: https://kr.object.ncloudstorage.com
    region: kr-standard
    access-key: ncp_iam_BPASKR2mqCpxc24Dtm5I
    secret-key: ncp_iam_BPKSKRJvRQ4UGL6HCktiiaePuR8QEVeO6y
    bucket-name: health-and-longevity-storage

# 새로 추가할 내용
server:
  tomcat:
    uri-encoding: UTF-8