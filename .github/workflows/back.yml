name: Back CI/CD

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd livecommerce-server
          ./gradlew clean build -x test

      - name: Copy JAR to public server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACK_PUBLIC_SSH_HOST }}
          username: ${{ secrets.BACK_PUBLIC_SSH_USER }}
          key: ${{ secrets.BACK_PUBLIC_SSH_KEY }}
          source: "livecommerce-server/build/libs/Health-and-longevity-0.0.1-SNAPSHOT.jar"
          target: "/var/www"

      - name: Copy JAR from public to private server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.BACK_PUBLIC_SSH_HOST }}
          username: ${{ secrets.BACK_PUBLIC_SSH_USER }}
          key: ${{ secrets.BACK_PUBLIC_SSH_KEY }}
          script: |
            scp /var/www/Health-and-longevity-0.0.1-SNAPSHOT.jar ${{ secrets.BACK_PRIVATE_SSH_USER }}@${{ secrets.BACK_PRIVATE_SSH_HOST }}:/var/www/

      - name: Restart Spring Boot on private server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.BACK_PRIVATE_SSH_HOST }}
          username: ${{ secrets.BACK_PRIVATE_SSH_USER }}
          key: ${{ secrets.BACK_PRIVATE_SSH_KEY }}
          script: |
            APP_NAME="Health-and-longevity-0.0.1-SNAPSHOT.jar"
            APP_DIR="/var/www"
            LOG_FILE="$APP_DIR/output.log"
            
            echo "📦 애플리케이션 배포 디렉터리로 이동"
            cd $APP_DIR
            
            echo "🛑 기존 실행 중인 프로세스 종료 시도..."
            PID=$(ps aux | grep $APP_NAME | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              echo "→ PID $PID 종료 중..."
              kill -15 $PID
              sleep 5
            else
              echo "→ 기존 실행 중인 프로세스 없음"
            fi
            
            echo "🚀 새 애플리케이션 백그라운드 실행"
            nohup java -jar $APP_NAME > $LOG_FILE 2>&1 &
            
            echo "✅ 배포 완료: $(date)"
            echo "🔍 로그: tail -f $LOG_FILE"